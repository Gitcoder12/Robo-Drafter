[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-drafter"
version = "0.1.0"
description = "Adaptive robotic agent that upgrades, mutates, or replaces policies based on task success"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DHARAVATH SATVIK"}]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
robo-drafter = "robo_drafter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
