[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-drafter"
version = "0.1.0"
description = "Adaptive robotic agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
]

[project.scripts]
robo-drafter = "robo_drafter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
